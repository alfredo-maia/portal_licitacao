services:
  db:
    image: postgres:16-alpine
    container_name: portal-licitacao-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pncp
      POSTGRES_PASSWORD: pncp_secret_2026
      POSTGRES_DB: portal_licitacao
    ports:
      - "15434:5432"
    volumes:
      - portal_licitacao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pncp -d portal_licitacao"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  portal_licitacao_pgdata:
